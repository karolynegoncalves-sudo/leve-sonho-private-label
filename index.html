<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Private Label — Leve Sonho</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;font-size:13px;background:#f0f2f5;color:#1a1a2e;padding:24px}
.wrap{max-width:620px;margin:0 auto}
h1{font-size:17px;margin-bottom:4px}
.sub{font-size:12px;color:#777;margin-bottom:20px}
a.card{display:flex;align-items:center;gap:14px;background:#fff;border-radius:8px;padding:14px 16px;box-shadow:0 2px 6px rgba(0,0,0,.12);text-decoration:none;color:inherit;margin-bottom:10px;border-left:4px solid #7B1FA2}
a.card:hover{box-shadow:0 3px 12px rgba(0,0,0,.18)}
a.card:focus-visible{outline:2px solid #7B1FA2;outline-offset:2px}
.nm{font-weight:bold;font-size:14px}
.ds{font-size:11.5px;color:#777;margin-top:3px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧵 Private Label — Leve Sonho</h1>
  <div class="sub">Planos de corte e fichas técnicas por cliente.</div>
  <a class="card" href="dancera/">
    <div>
      <div class="nm">DanCERA</div>
      <div class="ds">Plano de corte: rendimento medido na mesa, encaixe por infesto, comparativo entre tecido de 0,94 m e 1,22 m e lista de compras.</div>
    </div>
  </a>
</div>
</body>
</html>
